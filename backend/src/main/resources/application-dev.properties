# Yalnızca yerel geliştirme.

# Compose dosyası monorepo kökünde; bootRun backend/ klasöründen çalışır.
spring.docker.compose.file=../compose.yaml

# Yerelde https yok; çerez http üzerinden de gönderilsin.
vurli.session.secure-cookie=false

# E-postalar Mailpit'e gider: http://localhost:8025
spring.mail.host=localhost
spring.mail.port=1025
vurli.app-base-url=http://localhost:3000

# Kısa linkler de localhost:8080'de açılır.
vurli.short-base-url=http://localhost:8080
vurli.hosts.public=localhost

# Yerelde bütün istekler aynı adresten gelir; uçtan uca testler tekrar tekrar
# çalışabilsin diye adres başına sınırlar geniş. Gerçek değerler testlerde sınanıyor.
vurli.rate-limits.login-per-ip.capacity=1000
vurli.rate-limits.emails-per-ip.capacity=1000

# Ülke veritabanı: backend/ içinden scripts/download-geoip.sh ile indirilir.
vurli.analytics.geoip-database=data/geoip/dbip-country-lite.mmdb
