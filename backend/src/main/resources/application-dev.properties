# Yalnızca yerel geliştirme. Giriş sistemi gelene kadar (M2) bütün istekler bu sabit
# workspace adına çalışır.
spring.flyway.locations=classpath:db/migration,classpath:db/dev
vurli.dev.workspace-id=00000000-0000-0000-0000-000000000001

# Compose dosyası monorepo kökünde; bootRun backend/ klasöründen çalışır.
spring.docker.compose.file=../compose.yaml
