mail.verify.subject=Vurli için e-posta adresini doğrula
mail.verify.body=Vurli''ye hoş geldin!\n\
\n\
Link oluşturmaya başlamak için e-posta adresini doğrula:\n\
{0}\n\
\n\
Bu link 24 saat geçerli. Vurli''ye sen kaydolmadıysan bu e-postayı yok sayabilirsin.

mail.already-registered.subject=Vurli hesabın
mail.already-registered.body=Biri bu e-posta adresiyle Vurli''ye kaydolmayı denedi, ancak bu adresin zaten bir hesabı var.\n\
\n\
Sen denediysen buradan giriş yapabilirsin:\n\
{0}\n\
\n\
Şifreni mi unuttun? Buradan sıfırlayabilirsin:\n\
{1}\n\
\n\
Sen değilsen bu e-postayı yok sayabilirsin. Hesabında hiçbir şey değişmedi.

mail.reset.subject=Vurli şifreni sıfırla
mail.reset.body=Vurli hesabının şifresini sıfırlama isteği aldık.\n\
\n\
Yeni şifreni buradan belirleyebilirsin:\n\
{0}\n\
\n\
Bu link 1 saat geçerli ve yalnızca bir kez kullanılabilir. Şifre sıfırlandığında bütün cihazlarda oturumun kapanır.\n\
Bu isteği sen yapmadıysan bu e-postayı yok sayabilirsin. Şifren değişmedi.

