<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{admin/fragments :: head(#{admin.home.title})}"></head>
<body>
<header th:replace="~{admin/fragments :: bar}"></header>
<main>
	<h1 th:text="#{admin.home.title}">Admin panel</h1>
	<p class="warning" th:if="${backupCodes <= 3}" th:text="#{admin.home.backup-low(${backupCodes})}">Few backup codes left.</p>
	<section class="search">
		<form method="get" th:action="@{/admin/links}" class="inline">
			<label for="link-q" th:text="#{admin.links.search}">Find links</label>
			<input id="link-q" name="q" type="search" required th:placeholder="#{admin.links.placeholder}">
			<button type="submit" th:text="#{admin.search}">Search</button>
		</form>
		<form method="get" th:action="@{/admin/accounts}" class="inline">
			<label for="account-q" th:text="#{admin.accounts.search}">Find accounts</label>
			<input id="account-q" name="q" type="search" required th:placeholder="#{admin.accounts.placeholder}">
			<button type="submit" th:text="#{admin.search}">Search</button>
		</form>
	</section>
</main>
</body>
</html>
