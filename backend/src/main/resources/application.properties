spring.application.name=vurli

# Şema yalnızca Flyway migration'larıyla değişir; Hibernate sadece doğrular.
spring.jpa.hibernate.ddl-auto=validate
# Veritabanı bağlantısı view render edilirken açık kalmasın.
spring.jpa.open-in-view=false

# Kısa linklerin sunulduğu alan adı; bu alan adına giden hedefler reddedilir.
vurli.short-domain=vurli.io
# Paneldeki ve QR'daki kısa linklerin başı.
vurli.short-base-url=https://vurli.io
# İstekler yalnızca bu host'larda işlenir, diğerleri 404 alır (HostFilter).
# public: kısa linkler; internal: API ve health (Next.js ile iç ağ). Canlı ortamın iç
# host adı M4'te eklenir.
vurli.hosts.public=vurli.io
vurli.hosts.internal=localhost
# E-postalardaki doğrulama ve şifre sıfırlama linkleri kullanıcı paneline gider.
vurli.app-base-url=https://app.vurli.io
vurli.mail.from=Vurli <no-reply@vurli.io>
# SMTP sunucusu. Canlıda ortam değişkenleriyle verilir (M4); dev profili Mailpit'e,
# testler Mailpit konteynerine yönlendirir. Spring Boot e-posta göndericisini yalnızca
# bu ayar varsa oluşturur.
spring.mail.host=localhost
spring.mail.port=25

# Oturumlar veritabanında (Spring Session JDBC); tabloları Flyway (V4) oluşturur.
# Çerezin adı ve bayrakları SessionCookieConfiguration içinde, kodda tanımlı.
spring.session.jdbc.initialize-schema=never
spring.session.timeout=24h
vurli.session.secure-cookie=true

# Panel ve e-postalar Türkçe ve İngilizce; diğer dillerde İngilizce.
# Sunucunun kendi dili (ör. tr) yanlışlıkla varsayılan olmasın.
spring.messages.basename=messages
spring.messages.fallback-to-system-locale=false

# Dışarıya yalnızca health açık.
management.endpoints.web.exposure.include=health
