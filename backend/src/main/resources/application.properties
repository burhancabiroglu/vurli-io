spring.application.name=vurli

# Şema yalnızca Flyway migration'larıyla değişir; Hibernate sadece doğrular.
spring.jpa.hibernate.ddl-auto=validate
# Veritabanı bağlantısı view render edilirken açık kalmasın.
spring.jpa.open-in-view=false

# Kısa linklerin sunulduğu alan adı; bu alan adına giden hedefler reddedilir.
vurli.short-domain=vurli.io

# Dışarıya yalnızca health açık.
management.endpoints.web.exposure.include=health
