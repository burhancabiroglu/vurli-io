spring.application.name=vurli

# Şema yalnızca Flyway migration'larıyla değişir; Hibernate sadece doğrular.
spring.jpa.hibernate.ddl-auto=validate
# Veritabanı bağlantısı view render edilirken açık kalmasın.
spring.jpa.open-in-view=false

# Kısa linklerin sunulduğu alan adı; bu alan adına giden hedefler reddedilir.
vurli.short-domain=vurli.io
# Paneldeki ve QR'daki kısa linklerin başı.
vurli.short-base-url=https://vurli.io
# İstekler yalnızca bu host'larda işlenir, diğerleri 404 alır (HostFilter).
# public: kısa linkler; internal: API ve health (Next.js ile iç ağ). Canlı ortamın iç
# host adı M4'te eklenir.
vurli.hosts.public=vurli.io
vurli.hosts.internal=localhost
# admin: yönetici paneli (K43).
vurli.hosts.admin=admin.vurli.io
# E-postalardaki doğrulama ve şifre sıfırlama linkleri kullanıcı paneline gider.
vurli.app-base-url=https://app.vurli.io
vurli.mail.from=Vurli <no-reply@vurli.io>
# SMTP sunucusu. Canlıda ortam değişkenleriyle verilir (M4); dev profili Mailpit'e,
# testler Mailpit konteynerine yönlendirir. Spring Boot e-posta göndericisini yalnızca
# bu ayar varsa oluşturur.
spring.mail.host=localhost
spring.mail.port=25

# Oturumlar veritabanında (Spring Session JDBC); tabloları Flyway (V4) oluşturur.
# Çerezin adı ve bayrakları SessionCookieConfiguration içinde, kodda tanımlı.
spring.session.jdbc.initialize-schema=never
spring.session.timeout=24h
vurli.session.secure-cookie=true

# Panel ve e-postalar Türkçe ve İngilizce; diğer dillerde İngilizce.
# Sunucunun kendi dili (ör. tr) yanlışlıkla varsayılan olmasın.
spring.messages.basename=messages
spring.messages.fallback-to-system-locale=false

# Hız sınırları (K42). Sayaçlar bellekte; süreler Spring biçiminde (1m, 15m, 1h).
vurli.rate-limits.login-per-ip.capacity=10
vurli.rate-limits.login-per-ip.period=1m
vurli.rate-limits.login-failures-per-account.capacity=10
vurli.rate-limits.login-failures-per-account.period=15m
vurli.rate-limits.emails-per-ip.capacity=5
vurli.rate-limits.emails-per-ip.period=1h
vurli.rate-limits.link-creations-per-user.capacity=10
vurli.rate-limits.link-creations-per-user.period=1m
vurli.rate-limits.redirects-per-ip.capacity=300
vurli.rate-limits.redirects-per-ip.period=1m
# Yönetici girişinde yanlış TOTP veya yedek kod (K47).
vurli.rate-limits.totp-failures-per-user.capacity=5
vurli.rate-limits.totp-failures-per-user.period=15m
# Bir workspace'in 24 saatte oluşturabileceği link sayısı.
vurli.daily-link-quota=50
# İstemci adresi X-Forwarded-For'un son değerinden alınır: kısa linklerde Caddy, API'de
# Next.js yazar. Spring yalnızca bu ikisinin arkasında çalıştığı için güvenilir.
vurli.client-address.trust-forwarded-for=true

# İstatistik: tıklamalar bellekte sıraya alınıp saniyede bir toplu yazılır; ham kayıt
# 90 gün, günlük özet süresiz (K22). Ülke veritabanı (DB-IP, K44) yoksa ülke boş kalır;
# canlıda yolu ortam değişkeniyle verilir (M4).
vurli.analytics.queue-capacity=10000
vurli.analytics.retention=90d

# Yönetici TOTP anahtarlarını şifreleyen anahtar (K47): openssl rand -base64 32.
# Canlıda ortam değişkeniyle verilir (VURLI_ADMIN_TOTP_KEY); yoksa uygulama başlamaz.
# VURLI_ADMIN_PROMOTE ve VURLI_ADMIN_RESET_TOTP yalnızca gerektiğinde, bir başlangıç için
# verilir (K48, K49).
vurli.admin.session-timeout=1h

# Dışarıya yalnızca health açık.
management.endpoints.web.exposure.include=health
