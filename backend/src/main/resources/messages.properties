mail.verify.subject=Confirm your email for Vurli
mail.verify.body=Welcome to Vurli!\n\
\n\
Please confirm your email address to start creating links:\n\
{0}\n\
\n\
This link is valid for 24 hours. If you did not sign up for Vurli, you can ignore this email.

mail.already-registered.subject=Your Vurli account
mail.already-registered.body=Someone tried to sign up for Vurli with this email address, but it already has an account.\n\
\n\
If it was you, sign in here:\n\
{0}\n\
\n\
Forgot your password? Reset it here:\n\
{1}\n\
\n\
If it was not you, you can ignore this email. Your account has not changed.

mail.reset.subject=Reset your Vurli password
mail.reset.body=We received a request to reset the password for your Vurli account.\n\
\n\
Choose a new password here:\n\
{0}\n\
\n\
This link is valid for 1 hour and works once. Resetting signs you out on all devices.\n\
If you did not ask for this, you can ignore this email. Your password has not changed.

