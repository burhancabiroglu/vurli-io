version: 2
updates:
  - package-ecosystem: gradle
    directory: /backend
    schedule:
      interval: weekly
    groups:
      gradle:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ['*']
    # Büyük sürümler elle yükseltilir:
    # - @types/node, .nvmrc'deki Node sürümünü izler.
    # - typescript: typescript-eslint 7.x'i henüz desteklemiyor (lint çöküyor).
    # - eslint: eslint-config-next'in eklentileri en fazla 9'u destekliyor.
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      - dependency-name: eslint
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
