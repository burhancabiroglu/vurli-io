name: E2E

# Uçtan uca testler bütün sistemi birlikte çalıştırır: PostgreSQL ve Mailpit (Compose),
# Spring (bootRun, dev profili) ve panelin production build'i. Bu yüzden iki tarafın
# her değişikliğinde çalışır.
on:
  push:
    branches: [main]
    paths: ['backend/**', 'frontend/**', 'compose.yaml', '.github/workflows/e2e.yml']
  pull_request:
    paths: ['backend/**', 'frontend/**', 'compose.yaml', '.github/workflows/e2e.yml']

# İş yalnızca kodu okur; varsayılan token'a yazma yetkisi verilmez.
permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          validate-wrappers: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Start PostgreSQL and Mailpit
        run: docker compose up -d --wait

      # Konteynerler çalıştığı için Spring yenilerini başlatmaz, bunlara bağlanır.
      - name: Start backend
        working-directory: backend
        run: |
          ./gradlew bootRun --console=plain > "$RUNNER_TEMP/backend.log" 2>&1 &
          for i in $(seq 1 90); do
            curl -sf http://localhost:8080/actuator/health && exit 0
            sleep 2
          done
          cat "$RUNNER_TEMP/backend.log"
          exit 1

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Build
        working-directory: frontend
        run: npm run build

      # Playwright paneli `npm run start` ile kendisi başlatır.
      - name: End-to-end tests
        working-directory: frontend
        run: npm run e2e

      - name: Keep report and backend log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
            ${{ runner.temp }}/backend.log
          retention-days: 7
