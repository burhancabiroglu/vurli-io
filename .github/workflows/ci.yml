name: CI

on:
  push:
    branches: [main]
  pull_request:

# İş yalnızca kodu okur; varsayılan token'a yazma yetkisi verilmez.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'

      # Gradle cache'ini yönetir ve repodaki wrapper jar'ın resmi olduğunu doğrular.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          validate-wrappers: true

      # Testcontainers, runner'daki Docker ile gerçek PostgreSQL başlatır.
      - name: Build and test
        run: ./gradlew build --console=plain
